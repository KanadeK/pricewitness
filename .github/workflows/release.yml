name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: python -m pip install -e ".[dev]"
      - name: Assert tag matches package version
        shell: bash
        run: |
          package_version="$(python -c 'from pricewitness import __version__; print(__version__)')"
          test "$GITHUB_REF_NAME" = "v${package_version}"
      - name: Run full release gate
        run: python scripts/release_check.py
      - name: Check package metadata
        run: python -m twine check release/*.whl release/*.tar.gz
      - name: Create immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --verify-tag
          --title "PriceWitness $GITHUB_REF_NAME"
          --notes-file "release-notes/$GITHUB_REF_NAME.md"
