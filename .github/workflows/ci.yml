name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install project and gates
        run: python -m pip install -e ".[dev]"
      - name: Check formatting
        run: python -m ruff format --check .
      - name: Lint
        run: python -m ruff check .
      - name: Type check
        run: python -m mypy
      - name: Test with branch coverage
        run: python -m pytest
      - name: Run packaged-data demo
        run: python -m pricewitness demo --output .ci-demo
      - name: Verify demo evidence
        run: >-
          python -m pricewitness verify .ci-demo/pricewitness.db
          .ci-demo/receipts/receipt-2026-01-12.txt
          .ci-demo/receipts/receipt-2026-03-18.txt
          .ci-demo/receipts/receipt-2026-07-30.txt

  release-gate:
    name: Release gate and clean-wheel install
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install release tooling
        run: python -m pip install -e ".[dev]"
      - name: Run full release gate
        run: python scripts/release_check.py
      - name: Check package metadata
        run: python -m twine check release/*.whl release/*.tar.gz
      - name: Upload verified release candidates
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pricewitness-release-candidate
          path: release/
          if-no-files-found: error
          retention-days: 14
