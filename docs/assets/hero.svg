      <rect x="188" width="196" height="42" rx="21" fill="#4c3d24"/>
      <text x="210" y="27" fill="#f1cb82">UNIT-PRICE PROOF</text>
    </g>
  </g>
  <g transform="translate(800 48)" filter="url(#shadow)">
    <path d="M0 20 Q0 0 20 0 H280 Q300 0 300 20 V312 L280 300 260 312 240 300 220 312 200 300 180 312 160 300 140 312 120 300 100 312 80 300 60 312 40 300 20 312 0 300Z" fill="#fffaf0"/>
    <text x="28" y="48" fill="#607067" font-family="ui-monospace, monospace" font-size="13" font-weight="700">FRESH BASKET / 2026-07-30</text>
    <line x1="28" y1="66" x2="272" y2="66" stroke="#d9d0be"/>
    <g fill="#21312a" font-family="ui-monospace, monospace" font-size="14">
      <text x="28" y="98">OAT BARISTA 1L</text><text x="232" y="98">3.59</text>
      <text x="28" y="128">DARK ROAST 450G</text><text x="232" y="128">9.49</text>
      <text x="28" y="158">DUR PASTA 500G</text><text x="232" y="158">1.69</text>
    </g>
    <line x1="28" y1="180" x2="272" y2="180" stroke="#d9d0be"/>
    <path d="M30 256 L78 244 126 249 174 201 222 185 270 151" fill="none" stroke="#1f815d" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#1f815d">
      <circle cx="30" cy="256" r="5"/><circle cx="78" cy="244" r="5"/><circle cx="126" cy="249" r="5"/><circle cx="174" cy="201" r="5"/><circle cx="222" cy="185" r="5"/><circle cx="270" cy="151" r="5"/>
    </g>
    <rect x="28" y="270" width="160" height="24" rx="12" fill="#f4dfb4"/>
    <text x="40" y="287" fill="#7b4b00" font-family="ui-monospace, monospace" font-size="11" font-weight="700">PACKAGE SHRINK 10%</text>
