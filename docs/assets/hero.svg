<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">PriceWitness</title>
  <desc id="desc">A receipt becomes a verified product and unit-price timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15211d"/>
      <stop offset="1" stop-color="#23372f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#08100d" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="34" r="210" fill="#90dfb6" opacity=".07"/>
  <circle cx="80" cy="420" r="190" fill="#e8bd68" opacity=".06"/>
  <g transform="translate(72 76)">
    <text x="0" y="42" fill="#8fe0b7" font-family="ui-monospace, monospace" font-size="17" font-weight="700" letter-spacing="4">LOCAL RECEIPT EVIDENCE</text>
    <text x="0" y="124" fill="#fff8e9" font-family="Inter, ui-sans-serif, sans-serif" font-size="76" font-weight="800" letter-spacing="-5">PriceWitness</text>
    <text x="2" y="173" fill="#cbd9d1" font-family="Inter, ui-sans-serif, sans-serif" font-size="24">Your grocery basket remembers what the shelf tag forgets.</text>
    <g transform="translate(2 215)" font-family="ui-monospace, monospace" font-size="15">
      <rect width="174" height="42" rx="21" fill="#284c3e"/>
